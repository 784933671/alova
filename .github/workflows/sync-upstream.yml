name: Sync upstream main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto/publish：同步并补发缺失版本；pack：仅打包'
        type: choice
        default: auto
        options:
          - auto
          - pack
          - publish

permissions:
  contents: read

env:
  NPM_REGISTRY: https://www.ttxli.cn/npm/

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '784933671/alova' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Merge upstream main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # 原生合并接口保留本仓库提交，冲突时返回失败。
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main > "$RUNNER_TEMP/sync-result.json"; then
            echo '::error::上游同步失败；如存在合并冲突，请手动解决后重试。未执行强制覆盖。'
            exit 1
          fi

          jq -r '.message' "$RUNNER_TEMP/sync-result.json" >> "$GITHUB_STEP_SUMMARY"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  metadata:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spec: ${{ steps.package.outputs.spec }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - name: Resolve the exact package version
        id: package
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          spec=$(node scripts/prepare-cm-package.mjs "$SOURCE_SHA" --print-spec)
          printf 'spec=%s\n' "$spec" >> "$GITHUB_OUTPUT"

  check:
    needs: metadata
    if: inputs.mode != 'pack'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      missing: ${{ steps.registry.outputs.missing }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
          package-manager-cache: false

      - name: Check whether the version needs publishing
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ needs.metadata.outputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?请在 GitHub Actions Secrets 中配置 NPM_TOKEN}"
          [[ "$PACKAGE_SPEC" =~ ^@cm/alova-patched@[0-9A-Za-z.-]+$ ]]

          # 私服是发布状态的依据，合并后没有新提交也要检查。
          if result=$(npm view "$PACKAGE_SPEC" version --json --prefer-online --registry "$NPM_REGISTRY" 2> "$RUNNER_TEMP/npm-view.log"); then
            jq -e --arg version "${PACKAGE_SPEC##*@}" '. == $version' <<< "$result" > /dev/null
            printf '`%s` 已发布，跳过打包和发布。\n' "$PACKAGE_SPEC" >> "$GITHUB_STEP_SUMMARY"
            printf 'missing=false\n' >> "$GITHUB_OUTPUT"
          elif jq -e '.error.code == "E404"' <<< "$result" > /dev/null; then
            printf 'missing=true\n' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.log" >&2
            echo '::error::无法确认私服中的目标版本，已停止打包和发布。'
            exit 1
          fi

  pack:
    needs: [sync, metadata, check]
    if: >-
      !cancelled() && needs.sync.result == 'success' && needs.metadata.result == 'success' &&
      (inputs.mode == 'pack' || (needs.check.result == 'success' && needs.check.outputs.missing == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NPM_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @alova/shared run build
          pnpm --filter alova run build

      - name: Verify token refresh patch
        run: |
          pnpm --filter @alova/mock run build
          pnpm --filter @alova/adapter-xhr run build
          pnpm exec vitest run \
            packages/client/test/functions/createClientTokenAuthentication.spec.ts \
            packages/client/test/functions/createServerTokenAuthentication.spec.ts

      - name: Pack patched alova
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
          PACKAGE_SPEC: ${{ needs.metadata.outputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/npm-packages"
          mkdir -p "$package_dir"

          node scripts/prepare-cm-package.mjs "$SOURCE_SHA"
          pnpm --dir packages/alova pack --out "$package_dir/alova-patched.tgz"

          shared_version=$(jq -er '.version' packages/shared/package.json)
          tar -xOzf "$package_dir/alova-patched.tgz" package/package.json |
            jq -e --arg spec "$PACKAGE_SPEC" --arg version "$shared_version" '
              (.name + "@" + .version) == $spec and .dependencies["@alova/shared"] == $version
            ' > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [metadata, check, pack]
    if: needs.check.outputs.missing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
          package-manager-cache: false

      - name: Publish to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ needs.metadata.outputs.spec }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?请在 GitHub Actions Secrets 中配置 NPM_TOKEN}"

          tarball="$RUNNER_TEMP/npm-packages/alova-patched.tgz"
          manifest=$(tar -xOzf "$tarball" package/package.json)
          spec=$(jq -er 'select(.name == "@cm/alova-patched" and .publishConfig == null) | .name + "@" + .version' <<< "$manifest")
          [[ "$spec" == "$PACKAGE_SPEC" ]]

          # 仅将 404 视为缺少该版本，避免掩盖鉴权或网络错误。
          if result=$(npm view "$spec" version --json --prefer-online --registry "$NPM_REGISTRY" 2> "$RUNNER_TEMP/npm-view.log"); then
            jq -e --arg version "${spec##*@}" '. == $version' <<< "$result" > /dev/null
            printf '%s 已发布，跳过。\n' "$spec"
            exit 0
          fi
          if ! jq -e '.error.code == "E404"' <<< "$result" > /dev/null; then
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi

          shared_version=$(jq -er '.dependencies["@alova/shared"]' <<< "$manifest")
          npm view "@alova/shared@$shared_version" version --json --registry "$NPM_REGISTRY" > /dev/null
          npm publish "$tarball" --registry "$NPM_REGISTRY" --tag cm --access restricted --ignore-scripts
          npm view '@cm/alova-patched@cm' version --json --prefer-online --registry "$NPM_REGISTRY" |
            jq -e --arg version "${spec##*@}" '. == $version' > /dev/null
          printf '已发布 `%s`，标签为 `cm`。\n\n' "$spec" >> "$GITHUB_STEP_SUMMARY"
