name: Sync upstream main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto：有更新时发布；pack：仅打包；publish：发布当前 main'
        type: choice
        default: auto
        options:
          - auto
          - pack
          - publish

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '784933671/alova' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - name: Merge upstream main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          before=$(gh api "$branch" --jq '.object.sha')

          # 原生合并接口保留本仓库提交，冲突时返回失败。
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main > "$RUNNER_TEMP/sync-result.json"; then
            echo '::error::上游同步失败；如存在合并冲突，请手动解决后重试。未执行强制覆盖。'
            exit 1
          fi

          jq -r '.message' "$RUNNER_TEMP/sync-result.json" >> "$GITHUB_STEP_SUMMARY"
          sha=$(gh api "$branch" --jq '.object.sha')
          updated=false
          if [[ "$sha" != "$before" ]]; then
            updated=true
          fi
          printf 'sha=%s\nupdated=%s\n' "$sha" "$updated" >> "$GITHUB_OUTPUT"

  pack:
    needs: sync
    if: needs.sync.outputs.updated == 'true' || inputs.mode == 'pack' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NPM_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @alova/shared run build
          pnpm --filter alova run build

      - name: Verify token refresh patch
        run: |
          pnpm --filter @alova/mock run build
          pnpm --filter @alova/adapter-xhr run build
          pnpm exec vitest run \
            packages/client/test/functions/createClientTokenAuthentication.spec.ts \
            packages/client/test/functions/createServerTokenAuthentication.spec.ts

      - name: Pack patched alova
        env:
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/npm-packages"
          mkdir -p "$package_dir"

          node scripts/prepare-cm-package.mjs "$SOURCE_SHA"
          pnpm --dir packages/alova pack --out "$package_dir/alova-patched.tgz"

          shared_version=$(jq -er '.version' packages/shared/package.json)
          tar -xOzf "$package_dir/alova-patched.tgz" package/package.json |
            jq -e --arg version "$shared_version" '
              .name == "@cm/alova-patched" and .dependencies["@alova/shared"] == $version
            ' > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: pack
    if: inputs.mode != 'pack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      NPM_REGISTRY: https://www.ttxli.cn/npm/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
          package-manager-cache: false

      - name: Publish to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?请在 GitHub Actions Secrets 中配置 NPM_TOKEN}"

          tarball="$RUNNER_TEMP/npm-packages/alova-patched.tgz"
          manifest=$(tar -xOzf "$tarball" package/package.json)
          spec=$(jq -er 'select(.name == "@cm/alova-patched" and .publishConfig == null) | .name + "@" + .version' <<< "$manifest")

          # 仅将 404 视为缺少该版本，避免掩盖鉴权或网络错误。
          if result=$(npm view "$spec" version --json --prefer-online --registry "$NPM_REGISTRY" 2> "$RUNNER_TEMP/npm-view.log"); then
            printf '%s 已发布，跳过。\n' "$spec"
            exit 0
          fi
          if ! jq -e '.error.code == "E404"' <<< "$result" > /dev/null; then
            cat "$RUNNER_TEMP/npm-view.log" >&2
            exit 1
          fi

          shared_version=$(jq -er '.dependencies["@alova/shared"]' <<< "$manifest")
          npm view "@alova/shared@$shared_version" version --json --registry "$NPM_REGISTRY" > /dev/null
          npm publish "$tarball" --registry "$NPM_REGISTRY" --tag cm --access restricted --ignore-scripts
          npm view "$spec" version --json --prefer-online --registry "$NPM_REGISTRY"
          printf '已发布 `%s`，标签为 `cm`。\n\n' "$spec" >> "$GITHUB_STEP_SUMMARY"
